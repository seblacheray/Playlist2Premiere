[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist2premiere"
version = "0.1.0"
description = "Convert video playlists to Final Cut Pro 7 XML"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.gui-scripts]
playlist2premiere = "playlist2premiere.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
