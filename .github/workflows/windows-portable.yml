name: Windows portable

on:
  workflow_dispatch:
    inputs:
      source_archive_url:
        description: 'HTTPS URL of the exact corresponding-source ZIP (with SOURCE-MANIFEST.json)'
        type: string
        required: false
      source_archive_sha256:
        description: 'Expected SHA-256 of the reviewed source ZIP'
        type: string
        required: false
      sources_reviewed:
        description: 'Owner confirms sources and notices cover the exact built components'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: |
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed' }
      - name: Download and verify standalone FFmpeg tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Non-shared Windows x64 build: FFprobe runs without external FFmpeg DLLs.
          $release = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest'
          $asset = 'ffmpeg-master-latest-win64-gpl.zip'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $checksum = Join-Path $env:RUNNER_TEMP 'checksums.sha256'
          Invoke-WebRequest "$release/checksums.sha256" -OutFile $checksum
          $pattern = '^([a-fA-F0-9]{64})\s+\*?' + [regex]::Escape($asset) + '$'
          $checksumLines = @(Get-Content $checksum | Where-Object { $_ -match $pattern })
          if ($checksumLines.Count -ne 1) { throw "Expected exactly one published checksum for $asset" }
          $expected = [regex]::Match($checksumLines[0], $pattern).Groups[1].Value
          Invoke-WebRequest "$release/$asset" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'FFmpeg checksum mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'ffmpeg-tools'
          Expand-Archive $archive -DestinationPath $tools
          $probe = @(Get-ChildItem $tools -Filter ffprobe.exe -Recurse -File)
          $ffmpeg = @(Get-ChildItem $tools -Filter ffmpeg.exe -Recurse -File)
          if ($probe.Count -ne 1 -or $ffmpeg.Count -ne 1) { throw 'Expected one FFprobe and FFmpeg executable' }
          foreach ($executable in @($probe[0].FullName, $ffmpeg[0].FullName)) {
            if (!(Test-Path -LiteralPath $executable -PathType Leaf) -or (Get-Item -LiteralPath $executable).Length -eq 0) { throw "Missing or empty executable: $executable" }
            & $executable -version
            if ($LASTEXITCODE -ne 0) { throw "Downloaded executable cannot run: $executable" }
          }
          "FFMPEG_DOWNLOAD_URL=$release/$asset" >> $env:GITHUB_ENV
          $configuration = (& $probe[0].FullName -version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect FFprobe configuration' }
          if ($configuration -match '--enable-nonfree') { throw 'Nonfree FFprobe cannot be distributed' }
          if ($configuration -notmatch '--enable-gpl' -or $configuration -notmatch '--enable-version3') { throw 'Expected GPL v3 FFprobe configuration' }
          $configuration | Set-Content (Join-Path $env:RUNNER_TEMP 'ffprobe-configuration.txt')
          $probe[0].DirectoryName >> $env:GITHUB_PATH
          "FFPROBE_EXE=$($probe[0].FullName)" >> $env:GITHUB_ENV
          "FFMPEG_TOOLS=$tools" >> $env:GITHUB_ENV
          "FFMPEG_SHA256=$expected" >> $env:GITHUB_ENV
      - name: Run all tests including media integration
        run: |
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe unavailable' }
          python -m pytest -q -rs --junitxml=test-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build portable executable with embedded FFprobe
        shell: pwsh
        run: ./scripts/build_windows.ps1 -FFprobe $env:FFPROBE_EXE
      - name: Smoke test frozen application without Python or FFprobe on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $media = Join-Path $env:RUNNER_TEMP 'médias & test #1'
          New-Item -ItemType Directory -Path $media | Out-Null
          $fixturePath = Join-Path $media 'vidéo & test.mp4'
          ffmpeg -nostdin -v error -f lavfi -i 'color=s=160x90:r=30000/1001' -f lavfi -i 'sine=sample_rate=48000' -t 1 -c:v libx264 -c:a aac -ac 2 -shortest $fixturePath
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
          $result = Join-Path $media 'result.xml'
          $exe = (Resolve-Path dist/Playlist2Premiere.exe).Path
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $process = Start-Process -FilePath $exe -ArgumentList @('--packaging-smoke-test', "`"$fixturePath`"", "`"$result`"") -PassThru
            if (!$process.WaitForExit(120000)) { $process.Kill(); throw 'Frozen application timed out' }
            if ($process.ExitCode -ne 0) { throw "Frozen application failed: $($process.ExitCode)" }
          } finally { $env:PATH = $oldPath }
          [xml]$xml = Get-Content -LiteralPath $result -Raw
          if (@($xml.xmeml.sequence.media.video.track.clipitem).Count -ne 1) { throw 'Missing video clip' }
          if (@($xml.xmeml.sequence.media.audio.track).Count -ne 2) { throw 'Missing stereo audio' }
      - name: Prepare portable download and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item dist/Playlist2Premiere.exe portable/
          Copy-Item README.md portable/
          Copy-Item docs/premiere-validation.md portable/
          # Retain the distributor's licenses/notices alongside the executable.
          $root = (Get-Item $env:FFPROBE_EXE).Directory.Parent.FullName
          New-Item -ItemType Directory portable/ffmpeg-notices | Out-Null
          Copy-Item "$root\*" portable/ffmpeg-notices/ -Recurse -Exclude bin
          "FFprobe: BtbN standalone Windows x64 GPL build. Download: $env:FFMPEG_DOWNLOAD_URL. Archive SHA-256: $env:FFMPEG_SHA256`nSource and build information: https://github.com/BtbN/FFmpeg-Builds`nFFmpeg source: https://github.com/FFmpeg/FFmpeg`nPySide6/Qt license information: https://doc.qt.io/qtforpython-6/licenses.html" | Set-Content portable/THIRD-PARTY.txt
          Get-FileHash portable/Playlist2Premiere.exe -Algorithm SHA256 | Format-List | Out-File portable/SHA256.txt
      - name: Collect license texts and build inventory
        run: |
          python scripts/package_legal.py portable/legal
          if ($LASTEXITCODE -ne 0) { throw 'Legal evidence collection failed' }
          Copy-Item "$env:RUNNER_TEMP/ffprobe-configuration.txt" portable/legal/
          Copy-Item LICENSE portable/
          Copy-Item THIRD-PARTY.md portable/
      - name: Attach reviewed corresponding sources
        if: github.event_name == 'workflow_dispatch' && inputs.sources_reviewed
        env:
          SOURCE_URL: ${{ inputs.source_archive_url }}
          SOURCE_SHA256: ${{ inputs.source_archive_sha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [Uri]$env:SOURCE_URL
          if (!$uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or $uri.UserInfo) { throw 'A public HTTPS source archive URL without credentials is required' }
          if ($env:SOURCE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Expected source archive SHA-256 required' }
          $archive = 'portable/legal/corresponding-source.zip'
          Invoke-WebRequest $uri.AbsoluteUri -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:SOURCE_SHA256) { throw 'Source archive checksum mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $entry = $zip.GetEntry('SOURCE-MANIFEST.json')
            if (!$entry) { throw 'SOURCE-MANIFEST.json is required at archive root' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if (!$manifest.components) { throw 'Source manifest must identify components' }
          } finally { $zip.Dispose() }
          "$env:SOURCE_URL`nSHA-256: $env:SOURCE_SHA256`nOwner review confirmed; completeness is not automatically certified." | Set-Content portable/legal/source-provenance.txt
      - name: Upload review evidence (no portable executable)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-license-review-evidence
          path: |
            portable/legal/
            portable/ffmpeg-notices/
            portable/THIRD-PARTY.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.sources_reviewed
        with:
          name: Playlist2Premiere-Windows-x64-portable
          path: portable/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-results
          path: test-results.xml
          if-no-files-found: ignore
